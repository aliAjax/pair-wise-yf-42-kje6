<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>动物园谱系与繁育协调</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 2rem; color: #1f2937; }
    main { max-width: 960px; margin: auto; }
    pre { background: #f3f4f6; padding: 1rem; border-radius: 8px; overflow-x: auto; }
    button { padding: .4rem .7rem; cursor: pointer; margin-right: .4rem; }
    section { margin-bottom: 2rem; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #d1d5db; padding: .5rem; text-align: left; vertical-align: top; }
    th { background: #f9fafb; }
    .muted { color: #6b7280; }
    .pill { display: inline-block; padding: .1rem .5rem; border-radius: 999px; font-size: .8rem; }
    .pill.pending { background: #fef3c7; color: #92400e; }
    .pill.returned { background: #fee2e2; color: #991b1b; }
    .pill.completed { background: #d1fae5; color: #065f46; }
    .pill.failed { background: #fee2e2; color: #991b1b; }
    .pill.processing { background: #dbeafe; color: #1e40af; }
  </style>
</head>
<body>
<main>
  <h1>动物园谱系与繁育协调</h1>
  <p>外部谱系导入后逐头对账，冲突交协调员裁定；血缘改动触发待批配对重算近交系数，超线退回待复核。</p>
  <p><button onclick="checkHealth()">检查服务状态</button></p>
  <pre id="health">等待操作</pre>

  <section>
    <h2>谱系导入批次</h2>
    <button onclick="loadImports()">刷新</button>
    <div id="imports">加载中…</div>
  </section>

  <section>
    <h2>待裁定冲突</h2>
    <button onclick="loadConflicts()">刷新</button>
    <div id="conflicts">加载中…</div>
  </section>

  <section>
    <h2>退回待复核配对</h2>
    <button onclick="loadReturned()">刷新</button>
    <div id="returned">加载中…</div>
  </section>

  <section>
    <h2>审计记录</h2>
    <button onclick="loadAudit()">刷新</button>
    <div id="audit">加载中…</div>
  </section>
</main>
<script>
async function checkHealth() {
  const response = await fetch('/health');
  document.getElementById('health').textContent = JSON.stringify(await response.json(), null, 2);
}

function pill(status) {
  return '<span class="pill ' + status + '">' + status + '</span>';
}

async function loadImports() {
  const response = await fetch('/api/pedigree-imports');
  const data = await response.json();
  const items = data.items || [];
  if (!items.length) {
    document.getElementById('imports').innerHTML = '<p class="muted">暂无导入批次</p>';
    return;
  }
  let html = '<table><tr><th>批次号</th><th>状态</th><th>进度</th><th>结果</th></tr>';
  for (const item of items) {
    const d = item.data;
    const results = (d.results || []).map(r => r.animal_id + ':' + r.outcome).join(', ');
    html += '<tr><td>' + (d.batch_key || item.id) + '</td><td>' + pill(item.status) + '</td>'
      + '<td>' + (d.processed || 0) + ' / ' + (d.records ? d.records.length : 0) + '</td>'
      + '<td class="muted">' + results + (d.error ? '<br>错误: ' + d.error : '') + '</td></tr>';
  }
  html += '</table>';
  document.getElementById('imports').innerHTML = html;
}

async function loadConflicts() {
  const response = await fetch('/api/conflicts');
  const data = await response.json();
  const items = (data.items || []).filter(c => c.status === 'pending');
  if (!items.length) {
    document.getElementById('conflicts').innerHTML = '<p class="muted">无待裁定冲突</p>';
    return;
  }
  let html = '<table><tr><th>动物编号</th><th>本地父母</th><th>外部父母</th><th>操作</th></tr>';
  for (const item of items) {
    const d = item.data;
    const local = d.local || {};
    const external = d.external || {};
    html += '<tr><td>' + d.animal_id + '</td>'
      + '<td>公: ' + (local.sire_id || '—') + '<br>母: ' + (local.dam_id || '—') + '</td>'
      + '<td>公: ' + (external.sire_id || '—') + '<br>母: ' + (external.dam_id || '—') + '</td>'
      + '<td><button onclick="adjudicate(\'' + item.id + '\', \'local\')">采用本地</button>'
      + '<button onclick="adjudicate(\'' + item.id + '\', \'external\')">采用外部</button></td></tr>';
  }
  html += '</table>';
  document.getElementById('conflicts').innerHTML = html;
}

async function adjudicate(conflictId, choice) {
  const response = await fetch('/api/conflicts/' + conflictId + '/actions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'adjudicate', data: { choice: choice } })
  });
  if (response.ok) {
    loadConflicts();
    loadReturned();
  } else {
    alert('裁定失败: ' + (await response.json()).error);
  }
}

async function loadReturned() {
  const response = await fetch('/api/pairings?status=returned');
  const data = await response.json();
  const items = data.items || [];
  if (!items.length) {
    document.getElementById('returned').innerHTML = '<p class="muted">无退回配对</p>';
    return;
  }
  let html = '<table><tr><th>配对编号</th><th>公</th><th>母</th><th>退回原因</th></tr>';
  for (const item of items) {
    const d = item.data;
    const reason = d.return_reason || {};
    const reasonText = reason.reason === 'inbreeding_coefficient_exceeded'
      ? '近交系数超线: ' + reason.coefficient + ' > ' + reason.threshold + ' (触发: ' + reason.trigger_animal_id + ')'
      : JSON.stringify(reason);
    html += '<tr><td>' + item.id + '</td><td>' + (d.sire_id || '—') + '</td><td>' + (d.dam_id || '—') + '</td><td>' + reasonText + '</td></tr>';
  }
  html += '</table>';
  document.getElementById('returned').innerHTML = html;
}

async function loadAudit() {
  const response = await fetch('/api/audit');
  const data = await response.json();
  const items = data.items || [];
  if (!items.length) {
    document.getElementById('audit').innerHTML = '<p class="muted">暂无审计记录</p>';
    return;
  }
  let html = '<table><tr><th>时间</th><th>实体</th><th>操作员</th><th>动作</th><th>状态变化</th></tr>';
  for (const item of items.slice(-50)) {
    html += '<tr><td>' + item.created_at + '</td><td>' + item.entity_id + '</td>'
      + '<td>' + item.actor_id + ' (' + item.actor_role + ')</td>'
      + '<td>' + item.action + '</td>'
      + '<td>' + (item.from_status || '—') + ' → ' + item.to_status + '</td></tr>';
  }
  html += '</table>';
  document.getElementById('audit').innerHTML = html;
}

loadImports();
loadConflicts();
loadReturned();
loadAudit();
</script>
</body>
</html>
